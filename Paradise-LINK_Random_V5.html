<!DOCTYPE html><html><head><meta charset="utf-8"><title>Paradise Manager Auto Update Only</title> <link rel="icon" type="image/png" href="favicon.png"> <style> /* ==========================================================    PARADISE LINK MANAGER    Paradise Lab Premium v1 ========================================================== */  *{     margin:0;     padding:0;     box-sizing:border-box; }  body{      font-family:"Segoe UI",Arial,sans-serif;      min-height:100vh;      padding:30px;      color:#fff;      background:     linear-gradient(rgba(3,8,20,.78),rgba(3,8,20,.88)),     url("https://images.unsplash.com/photo-1534796636912-3b95b3ab5986?q=80&w=1800&auto=format&fit=crop")     center center/cover fixed;  }  /*==========================       CONTAINER ===========================*/  .app{      max-width:1200px;      margin:auto;  }  /*==========================         HEADER ===========================*/  .header{      position:relative;      margin-bottom:28px;  }  .badge{      display:inline-block;      padding:8px 18px;      border-radius:50px;      background:linear-gradient(135deg,#00d4ff,#0078ff);      font-size:12px;      font-weight:bold;      letter-spacing:1px;      box-shadow:0 0 18px rgba(0,212,255,.45);      margin-bottom:16px;  }  .header h1{      font-size:34px;      font-weight:800;      letter-spacing:1px;      text-align:center;      text-shadow:0 0 15px rgba(0,212,255,.45);  }  /*==========================         ROW ===========================*/  .row{      display:grid;      grid-template-columns:1fr 1fr;      gap:22px;      margin-bottom:22px;  } .row3{      grid-template-columns:repeat(3,1fr);  } /*==========================         PANEL ===========================*/  .panel{      background:rgba(15,24,44,.72);      backdrop-filter:blur(15px);      -webkit-backdrop-filter:blur(15px);      border:1px solid rgba(255,255,255,.10);      border-radius:20px;      padding:22px;      margin-bottom:22px;      box-shadow:      0 15px 40px rgba(0,0,0,.35),      0 0 18px rgba(0,180,255,.08);      transition:.25s;  }  .panel:hover{      transform:translateY(-3px);      box-shadow:      0 18px 45px rgba(0,0,0,.45),      0 0 25px rgba(0,212,255,.15);  }  /*==========================       PANEL TITLE ===========================*/  .panel-title{      font-size:18px;      font-weight:700;      margin-bottom:14px;      color:#ffffff;      letter-spacing:.5px;  }  /*==========================        TEXTAREA ===========================*/  textarea{      width:100%;      resize:none;      border:none;      outline:none;      border-radius:14px;      background:#081425;      color:#ffffff;      padding:16px;      font-size:14px;      line-height:1.6;      border:1px solid rgba(255,255,255,.08);      transition:.25s;  }  textarea:focus{      border-color:#00d4ff;      box-shadow:0 0 15px rgba(0,212,255,.35);  }  #l1, #l2, #l3{      height:250px;  }  #status{      height:90px;  }  #db{      height:230px;  }  #hasil{      height:150px;  }  /*==========================       INPUT NUMBER ===========================*/  input[type=number]{      width:80px;      padding:10px;      border:none;      outline:none;      border-radius:10px;      background:#081425;      color:#fff;      border:1px solid rgba(255,255,255,.08);  }  /*==========================       LABEL ===========================*/  .option-group{      display:flex;      gap:30px;      margin-top:15px;      margin-bottom:15px;  }  .check{      display:block;      margin-bottom:18px;  }  label{      color:#fff;      font-size:14px;  }  input[type=radio], input[type=checkbox]{      margin-right:8px;  }  /*==========================         TOOLBAR ===========================*/  .toolbar{      display:flex;      align-items:center;      gap:12px;      margin-top:16px;      flex-wrap:wrap;  }  .button-row{      display:flex;      gap:12px;      margin-top:16px;  }  .button-row button{      flex:1;  }  /*==========================         BUTTON ===========================*/  button{      padding:13px 20px;      border:none;      border-radius:12px;      cursor:pointer;      color:#fff;      font-weight:bold;      font-size:14px;      background:linear-gradient(135deg,#00c6ff,#0072ff);      transition:.25s;  }  button:hover{      transform:translateY(-2px);      box-shadow:0 10px 22px rgba(0,114,255,.35);  }  button:active{      transform:scale(.98);  }  /* tombol khusus */  #cut{      width:100%;      background:linear-gradient(135deg,#00d26a,#009245);  }  #gas{      background:linear-gradient(135deg,#ff9800,#ef6c00);  }  #copy{      background:linear-gradient(135deg,#00c853,#009624);  }  #clear{      background:linear-gradient(135deg,#ff5252,#d50000);  }  /*==========================         TOAST ===========================*/  #toast{      position:fixed;      right:25px;      bottom:25px;      background:rgba(10,20,40,.92);      color:#fff;      padding:14px 22px;      border-radius:12px;      border:1px solid rgba(255,255,255,.12);      backdrop-filter:blur(12px);      opacity:0;      transform:translateY(20px);      transition:.3s;      z-index:9999;  }  #toast.show{      opacity:1;      transform:translateY(0);  }  /*==========================       SCROLLBAR ===========================*/  textarea::-webkit-scrollbar{      width:10px;  }  textarea::-webkit-scrollbar-track{      background:#081425;  }  textarea::-webkit-scrollbar-thumb{      border-radius:20px;      background:linear-gradient(#00d4ff,#0072ff);  }  /*==========================       MOBILE ===========================*/  @media(max-width:900px){      body{          padding:15px;      }      .row{          grid-template-columns:1fr;      }      .toolbar{          flex-direction:column;          align-items:stretch;      }      .button-row{          flex-direction:column;      }      input[type=number]{          width:100%;      }  }  /* ==========================================================    PARADISE LAB PREMIUM    PART 3 - FINISHING EFFECT ========================================================== */   /* =======================================================    PANEL GLASS SHINE EFFECT (OFF)    Aktifkan lagi jika ingin efek sapuan cahaya. ======================================================= */  /* .panel{      position:relative;      overflow:hidden;  }  .panel::before{      content:"";      position:absolute;      inset:0;      border-radius:20px;      pointer-events:none;      background:      linear-gradient(          135deg,          rgba(255,255,255,.08),          transparent 35%,          transparent 65%,          rgba(0,212,255,.08)      );  }  .panel::after{      content:"";      position:absolute;      top:-60%;      left:-120%;      width:70%;      height:220%;      transform:rotate(25deg);      background:      linear-gradient(          transparent,          rgba(255,255,255,.08),          transparent      );      transition:1.2s;  }  .panel:hover::after{      left:170%;  } */  /* ==========================       BUTTON PREMIUM ========================== */  button{      position:relative;      overflow:hidden;  }  button::before{      content:"";      position:absolute;      top:0;      left:-120%;      width:60px;      height:100%;      transform:skewX(-25deg);      background:rgba(255,255,255,.22);      transition:.8s;  }  button:hover::before{      left:160%;  }   /* ==========================       BADGE EFFECT ========================== */  .badge{      position:relative;      overflow:hidden;      animation:badgeGlow 3.5s ease-in-out infinite;  }  @keyframes badgeGlow{      0%,100%{          box-shadow:         0 0 10px rgba(0,212,255,.25);      }      50%{          box-shadow:         0 0 18px rgba(0,212,255,.55),         0 0 30px rgba(0,212,255,.18);      }  }  .badge::after{      content:"";      position:absolute;      top:-70%;      left:-120%;      width:45%;      height:250%;      transform:rotate(25deg);      background:linear-gradient(          transparent,          rgba(255,255,255,.45),          transparent      );      animation:badgeShine 6s linear infinite;  }  @keyframes badgeShine{      0%{          left:-120%;      }      20%{          left:150%;      }      100%{          left:150%;      }  }  .badge{      transition:.25s;  }  .badge:hover{      transform:translateY(-2px) scale(1.03);  }  /* ==========================       TITLE EFFECT ========================== */  .header h1{      animation:titleGlow 3s ease-in-out infinite alternate;  }  @keyframes titleGlow{      from{          text-shadow:          0 0 8px rgba(0,212,255,.35);      }      to{          text-shadow:          0 0 20px rgba(0,212,255,.9),          0 0 35px rgba(0,212,255,.35);      }  }   /* ==========================       TEXTAREA ========================== */  textarea{      transition:.25s;  }  textarea:hover{      border-color:#2ecbff;      box-shadow:      0 0 12px rgba(0,212,255,.18);  }   /* ==========================       INPUT NUMBER ========================== */  input[type=number]:focus{      border-color:#00d4ff;      box-shadow:      0 0 12px rgba(0,212,255,.35);  }   /* ==========================       SCROLLBAR ========================== */  ::-webkit-scrollbar{      width:10px;  }  ::-webkit-scrollbar-track{      background:#07111f;  }  ::-webkit-scrollbar-thumb{      border-radius:20px;      background:      linear-gradient(          #00d4ff,          #0072ff      );  }  ::-webkit-scrollbar-thumb:hover{      background:      linear-gradient(          #3be7ff,          #0094ff      );  }   /* ==========================       TEXT SELECTION ========================== */  ::selection{      background:#00d4ff;      color:#081425;  }   /* ==========================       PAGE OPEN ========================== */  .app{      animation:fadeUp .6s ease;  }  @keyframes fadeUp{      from{          opacity:0;          transform:translateY(25px);      }      to{          opacity:1;          transform:translateY(0);      }  }   /* ==========================       TOAST ========================== */  #toast{      box-shadow:      0 15px 35px rgba(0,0,0,.45),      0 0 25px rgba(0,212,255,.15);  }   /* ==========================       BUTTON HOVER ========================== */  button:hover{      letter-spacing:.5px;  }   .dbTools{} #hapusAtas{background:linear-gradient(135deg,#ff5252,#d50000);} #cutAtas{background:linear-gradient(135deg,#42a5f5,#1565c0);}  /* ===========================    USA CLOCK =========================== */  #usaClock{      position:fixed;      top:18px;      right:20px;      z-index:99999;      padding:12px 18px;      border-radius:14px;      background:rgba(15,23,42,.55);      backdrop-filter:blur(12px);      border:1px solid rgba(255,255,255,.12);      box-shadow:     0 0 20px rgba(56,189,248,.15);      text-align:center;      min-width:145px;  }  .usaTitle{      font-size:12px;      color:#9ecbff;      letter-spacing:1px;      margin-bottom:4px;      font-weight:bold;  }  #usaDate{      font-size:13px;      color:#b7d7ff;      margin-bottom:6px;      letter-spacing:.5px;  }   #usaTime{      font-size:24px;      color:#ffffff;      font-weight:bold;      font-family:Consolas,monospace;      text-shadow:0 0 10px rgba(255,255,255,.35);  } .cutGroup{      display:flex;      gap:10px;      margin-top:12px;  }  .cutGroup button{      flex:1;      margin:0;  }  /*========================== BOTTOM PANELS ===========================*/  .bottom-panels{      display:grid;      grid-template-columns:70% 40%;      gap:20px;  }  .bottom-panels .panel{      flex:1;      margin-bottom:0;  }  /*==========================* STATUS DATABASE *===========================*/  #statusDB{      min-height:170px;      resize:vertical;  }  #clearStatusDB{      width:42px;      font-size:18px;      padding:8px 0;  } .status-option-bar{      display:flex;      align-items:center;      margin:6px 0 4px;  }  .status-tools{      margin-left:auto;      display:flex;      gap:8px;      transform:translateY(-3px);  }  .status-tools button{      padding:6px 12px;      font-size:12px;      border-radius:8px;  } .status-tools button:hover{      transform:translateY(-1px);  }   .status-db-panel{     margin-top:150px; }    /* ==========================================================    PARADISE LAB THEME POPUP — 20 THEMES    Tambahan visual mandiri. Script utama aplikasi tidak diubah. ========================================================== */  .theme-launcher{     display:inline-flex;     align-items:center;     gap:8px;     cursor:pointer;     user-select:none;     outline:none; }  .theme-launcher:focus-visible{     box-shadow:     0 0 0 3px rgba(255,255,255,.25),     0 0 22px rgba(0,212,255,.65); }  .theme-launcher .theme-chevron{     font-size:11px;     opacity:.8;     transition:transform .25s ease; }  .theme-launcher[aria-expanded="true"] .theme-chevron{     transform:rotate(180deg); }  .theme-popup{     position:fixed;     inset:0;     z-index:1000000;     display:flex;     align-items:center;     justify-content:center;     padding:24px;     background:rgba(0,0,0,.66);     backdrop-filter:blur(9px);     -webkit-backdrop-filter:blur(9px);     opacity:0;     visibility:hidden;     transition:opacity .22s ease,visibility .22s ease; }  .theme-popup.show{     opacity:1;     visibility:visible; }  .theme-popup-card{     width:min(920px,96vw);     max-height:min(760px,88vh);     overflow:auto;     padding:22px;     border-radius:22px;     color:var(--theme-text,#fff);     background:var(--theme-panel,rgba(10,18,34,.96));     border:1px solid var(--theme-border,rgba(255,255,255,.16));     box-shadow:     0 30px 90px rgba(0,0,0,.55),     0 0 32px var(--theme-glow,rgba(0,212,255,.18));     transform:translateY(18px) scale(.97);     transition:transform .25s ease; }  .theme-popup.show .theme-popup-card{     transform:translateY(0) scale(1); }  .theme-popup-head{     display:flex;     align-items:center;     gap:14px;     margin-bottom:18px; }  .theme-popup-title{     min-width:0;     flex:1; }  . ne-height:1.25;     text-shadow:0 2px 8px rgba(0,0,0,.38); }  .theme-option .theme-check{     position:absolute;     top:10px;     right:10px;     z-index:2;     width:23px;     height:23px;     display:grid;     place-items:center;     border-radius:50%;     background:#fff;     color:#07111f;     font-size:13px;     font-weight:900;     opacity:0;     transform:scale(.6);     transition:.2s ease; }  .theme-option.active{     border-color:#fff;     box-shadow:     0 0 0 2px rgba(255,255,255,.34),     0 14px 30px rgba(0,0,0,.35); }  .theme-option.active .theme-check{     opacity:1;     transform:scale(1); }  body.theme-popup-open{     overflow:hidden; }  /* Variabel untuk 19 tema tambahan. Tema "Bawaan" tidak memberi    atribut data-theme sehingga tampilan asli tetap utuh. */  body[data-theme="bright-blue"]{     --theme-bg1:#eaf5ff;--theme-bg2:#fbfdff;--theme-panel:rgba(255,255,255,.94);     --theme-input:#ffffff;--theme-text:#10243f;--theme-muted:#52749d;     --theme-border:rgba(35,132,255,.58);--theme-accent:#1681ff;--theme-accent2:#55b7ff;     --theme-glow:rgba(35,132,255,.24);--theme-button-text:#fff; } body[data-theme="black-gold"]{     --theme-bg1:#030303;--theme-bg2:#171106;--theme-panel:rgba(13,12,9,.9);     --theme-input:#090806;--theme-text:#fff7d6;--theme-muted:#d3b864;     --theme-border:rgba(255,199,55,.58);--theme-accent:#ffd24a;--theme-accent2:#a96800;     --theme-glow:rgba(255,196,44,.28);--theme-button-text:#171006; } body[data-theme="midnight"]{     --theme-bg1:#020617;--theme-bg2:#0b1738;--theme-panel:rgba(8,17,39,.86);     --theme-input:#030b20;--theme-text:#eaf2ff;--theme-muted:#90a9d6;     --theme-border:rgba(74,120,255,.44);--theme-accent:#3f6cff;--theme-accent2:#112b78;     --theme-glow:rgba(63,108,255,.25);--theme-button-text:#fff; } body[data-theme="neon-purple"]{     --theme-bg1:#08020f;--theme-bg2:#210730;--theme-panel:rgba(23,7,34,.86);     --theme-input:#12031c;--theme-text:#f9edff;--theme-muted:#d4a4ed;     --theme-border:rgba(210,72,2
